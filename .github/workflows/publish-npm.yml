# .github/workflows/publish-npm.yml: Publish validated npm archives from version tags on main.
name: Publish npm

on:
  push:
    tags:
      - 'v.*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      runtime_sha256: ${{ steps.digest.outputs.runtime }}
      editor_sha256: ${{ steps.digest.outputs.editor }}
      export_sha256: ${{ steps.digest.outputs.export }}
    env:
      E2E_V2_EDITOR_PORT: 19202
      E2E_RUNTIME_PORT: 19201
      E2E_BLAZOR_PORT: 19237
      E2E_BLAZOR_SAMPLE_PORT: 19238
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Validate tag and package metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_SHA}^{commit}")"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          node tools/packaging/npm-release.mjs validate "$RELEASE_TAG"
      - run: npm ci
      - run: node --test tools/packaging/npm-release.test.mjs tools/packaging/metadata.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build dotnet/JsTimeline.sln -c Release
      - run: dotnet test dotnet/JsTimeline.sln -c Release --no-build
      - run: node tools/pages/build.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test --config e2e/blazor/playwright.config.ts
      - run: npx playwright test --config e2e/blazor-sample/playwright.config.ts
      - run: npx playwright test --config e2e/pages/playwright.config.ts
      - name: Pack and verify consumers offline
        run: |
          mkdir -p artifacts/npm artifacts/nuget
          npm pack --workspace packages/runtime --workspace packages/editor --workspace packages/export-css --ignore-scripts --pack-destination artifacts/npm
          dotnet pack dotnet/JsTimeline.Blazor/JsTimeline.Blazor.csproj -c Release --no-build -o artifacts/nuget
          version=$(dotnet msbuild dotnet/JsTimeline.Blazor/JsTimeline.Blazor.csproj -getProperty:Version)
          npm run test:packaging -- artifacts/npm "artifacts/nuget/JsTimeline.Blazor.${version}.nupkg"
      - name: Record archive digests
        id: digest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v.}
          for package in runtime editor export-css; do
            file="artifacts/npm/kazo-ca-timeline-${package}-${version}.tgz"
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            key=${package/-css/}
            echo "$key=$digest" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages
          path: artifacts/npm/*.tgz
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-packages
          path: artifacts/npm
      - name: Revalidate archives and publish in dependency order
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RUNTIME_SHA256: ${{ needs.prepare.outputs.runtime_sha256 }}
          EDITOR_SHA256: ${{ needs.prepare.outputs.editor_sha256 }}
          EXPORT_SHA256: ${{ needs.prepare.outputs.export_sha256 }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_SHA}^{commit}")"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          node tools/packaging/npm-release.mjs validate "$RELEASE_TAG"
          test "$(find artifacts/npm -type f | wc -l)" -eq 3
          version=${RELEASE_TAG#v.}
          echo "$RUNTIME_SHA256  artifacts/npm/kazo-ca-timeline-runtime-${version}.tgz" | sha256sum -c -
          echo "$EDITOR_SHA256  artifacts/npm/kazo-ca-timeline-editor-${version}.tgz" | sha256sum -c -
          echo "$EXPORT_SHA256  artifacts/npm/kazo-ca-timeline-export-css-${version}.tgz" | sha256sum -c -
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-publish.npmrc"
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          fi
          node tools/packaging/npm-release.mjs publish "$RELEASE_TAG" '@kazo-ca/timeline-runtime' "artifacts/npm/kazo-ca-timeline-runtime-${version}.tgz"
          node tools/packaging/npm-release.mjs publish "$RELEASE_TAG" '@kazo-ca/timeline-editor' "artifacts/npm/kazo-ca-timeline-editor-${version}.tgz"
          node tools/packaging/npm-release.mjs publish "$RELEASE_TAG" '@kazo-ca/timeline-export-css' "artifacts/npm/kazo-ca-timeline-export-css-${version}.tgz"
