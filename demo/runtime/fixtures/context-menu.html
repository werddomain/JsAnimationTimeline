<!-- demo/runtime/fixtures/context-menu.html -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Validation I1 — Menu contextuel</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; background: #1d1d20; color: #eee; font: 14px/1.5 Arial, sans-serif; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      h2 { font-size: 16px; margin: 14px 0 6px; }
      p { margin: 6px 0 12px; }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      button, input { font: inherit; }
      .editor-host { width: 100%; height: 350px; border: 1px solid #666; color: #252525; }
      #stage { position: relative; height: 68px; margin: 8px 0; border: 1px solid #555; overflow: hidden; }
      #target-object { position: absolute; left: 12px; top: 12px; width: 40px; height: 40px; background: #b5a0ff; }
      #fatal { color: #ff9c9c; white-space: pre-wrap; }
      #outside { min-height: 36px; }
      @media (max-width: 500px) { body { padding: 4px; } h1 { font-size: 18px; } .editor-host { height: 380px; } }
    </style>
  </head>
  <body>
    <h1>I1 · Menu contextuel</h1>
    <p>Clic droit sur les images ou calques. Maj+F10 ouvre le menu au clavier ; Échap revient à la timeline.</p>
    <div class="controls">
      <button id="reset" type="button">Réinitialiser</button>
      <button id="destroy" type="button">Détruire le premier éditeur</button>
      <label>Champ natif <input id="native-input" value="Menu du navigateur"></label>
    </div>
    <div id="stage" aria-label="Scène de validation"><div id="target-object"></div></div>
    <h2>Premier éditeur</h2>
    <div id="primary" class="editor-host"></div>
    <h2>Second éditeur indépendant</h2>
    <div id="secondary" class="editor-host"></div>
    <button id="outside" type="button">Hors des éditeurs</button>
    <pre id="fatal" hidden></pre>
    <script type="module" src="../src/fixtures/contextMenu.ts"></script>
  </body>
</html>
